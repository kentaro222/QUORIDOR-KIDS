<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUORIDOR KIDS — LCD</title>
<style>
:root{--ink:#384837;--lcd:#bcc99b;--red:#d95757;--yellow:#ddbb4c}*{box-sizing:border-box}body{margin:0;background:#e7e3d9;color:#363933;font-family:ui-monospace,'Courier New',monospace;padding:24px 12px 40px}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:3px}.machine{max-width:610px;margin:auto;background:#e0dcd1;border:2px solid #b8b4aa;border-radius:32px 32px 64px 32px;padding:24px;box-shadow:0 8px 0 #b5b1a6,0 18px 35px #39372e22,inset 2px 2px 0 #fff9}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;gap:12px}.brand{font-size:19px;font-weight:900;letter-spacing:2px}.edition{font-size:9px;letter-spacing:3px;margin-top:5px;color:#787a70}select{border:0;background:#cac6bb;border-radius:5px;padding:8px;font-size:12px;color:#454941}.bezel{background:#535951;border-radius:14px;padding:18px 20px 14px;box-shadow:inset 0 3px 5px #0004}.screen{background:var(--lcd);border:2px solid #2e372b;padding:12px 14px;box-shadow:inset 3px 4px 8px #52604560;color:var(--ink);position:relative}.status{display:flex;align-items:center;justify-content:space-between;font-size:12px;min-height:25px;margin-bottom:8px;font-weight:bold}.light{display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--red);box-shadow:0 0 0 1px #38483755}.goal{height:5px;background:var(--red);margin:3px 0 7px;opacity:.8}.goal.bottom{background:var(--yellow);margin:7px 0 3px}.board{width:100%;aspect-ratio:1;position:relative;touch-action:manipulation;isolation:isolate}.cell{position:absolute;background:#65765335;border:1px solid #5363424a;padding:0;border-radius:1px}.cell.legal:after{content:'';position:absolute;width:7px;height:7px;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);opacity:.6}.cell.legal:hover{background:#65765365}.wall{position:absolute;background:var(--ink);pointer-events:none;box-shadow:1px 1px #e3e8c133}.slot{position:absolute;border:0;padding:0;background:transparent;z-index:4}.slot:hover{background:#38483766}.slot.bad:hover{background:#d9575780}.pawn{position:absolute;z-index:6;width:10%;height:10%;pointer-events:none;transition:left .4s linear,top .4s linear;display:grid;place-items:center}.sprite{width:100%;height:100%;background-size:200% 100%;background-repeat:no-repeat;image-rendering:pixelated;animation:step .4s steps(1) infinite}.pawn.right .sprite{transform:scaleX(-1)}@keyframes step{50%{background-position:100% 0}}.fallback{width:60%;height:46%;background:var(--red);border-radius:45% 55% 30% 30%;position:absolute;box-shadow:2px 2px #38483730}.fallback:before{content:'';position:absolute;width:45%;height:65%;top:-38%;left:12%;background:inherit;border-radius:50%}.fallback:after{content:'';position:absolute;left:-35%;top:65%;width:40%;height:3px;background:inherit}.pawn[data-player="1"] .fallback{background:var(--yellow)}.caption{display:flex;justify-content:space-between;color:#c2c6b6;font-size:9px;letter-spacing:2px;margin-top:11px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 15px}.controls button{border:1px solid #9c9c92;border-radius:8px;background:#c3c4b9;box-shadow:0 4px #898e83,inset 1px 1px #fff8;min-height:54px;color:#454d42;font-size:12px;font-weight:bold;line-height:1.6}.controls button.active{background:#535e50;color:#f0f0dc;box-shadow:0 4px #354230}.controls button:active{transform:translateY(3px);box-shadow:0 1px #898e83}.symbol{display:block;font-size:26px;line-height:30px}.inventory{display:flex;gap:12px}.stock{flex:1;border-top:1px solid #b1b2a5;padding-top:11px;font-size:11px;display:flex;align-items:center;justify-content:space-between}.stock b{font-size:21px;letter-spacing:2px}.chip{width:9px;height:9px;display:inline-block;margin-right:5px;background:var(--red)}.stock.yellow .chip{background:var(--yellow)}.fence-mark{display:inline-block;width:22px;height:5px;background:#535e50;vertical-align:middle;margin-left:5px}.footer{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.minor{display:flex;gap:10px}.minor button{background:#babbb0;border:1px solid #999c91;border-radius:20px;padding:8px 13px;box-shadow:0 2px #92978a;font-size:11px;color:#454d42}.grille{width:75px;height:32px;background:repeating-linear-gradient(90deg,transparent 0 7px,#a6a99c 7px 10px);transform:skewY(-10deg)}.message{text-align:center;font-size:11px;min-height:18px;margin:16px 0 0;color:#65695e}.help{max-width:550px;margin:22px auto 0;font-size:11px;line-height:1.9;color:#72766a}button:disabled{cursor:default;opacity:.5}@media(max-width:450px){body{padding:12px 8px 25px}.machine{padding:16px 12px 21px;border-radius:23px 23px 45px 23px}.bezel{padding:13px 10px 11px}.screen{padding:9px}.brand{font-size:16px}.controls{gap:8px;margin-top:16px}.controls button{font-size:11px}.caption{font-size:8px;letter-spacing:1px}}@media(prefers-reduced-motion:reduce){.pawn{transition:none}.sprite{animation:none}}
</style></head><body>
<main class="machine"><header><div><div class="brand">QUORIDOR KIDS</div><div class="edition">POCKET LCD</div></div><select id="opponent" aria-label="対戦モード"><option value="cpu">CPU対戦</option><option value="human">2人対戦</option></select></header>
<div class="bezel"><section class="screen" aria-label="ゲーム画面"><div class="status"><span id="turn" aria-live="polite"></span><span id="round">TURN 01</span></div><div class="goal" aria-label="赤のゴール"></div><div class="board" id="board" aria-label="7×7の盤面"></div><div class="goal bottom" aria-label="黄色のゴール"></div></section><div class="caption"><span>DOT MATRIX DISPLAY</span><span>● TWO MICE / ONE MAZE</span></div></div>
<div class="controls" aria-label="操作"><button data-mode="move" class="active" aria-label="駒を動かす" title="駒を動かす"><span class="symbol" aria-hidden="true">✥</span></button><button data-mode="h" aria-label="横の壁" title="横の壁"><span class="symbol" aria-hidden="true">━</span></button><button data-mode="v" aria-label="縦の壁" title="縦の壁"><span class="symbol" aria-hidden="true">┃</span></button></div>
<div class="inventory"><div class="stock" aria-label="赤の残りの壁"><span aria-hidden="true"><i class="chip"></i><i class="fence-mark"></i></span><b id="stock0">08</b></div><div class="stock yellow" aria-label="黄色の残りの壁"><span aria-hidden="true"><i class="chip"></i><i class="fence-mark"></i></span><b id="stock1">08</b></div></div><div class="footer"><div class="minor"><button id="undo">戻す</button><button id="reset">リセット</button></div><div class="grille" aria-hidden="true"></div></div><p class="message" id="message" aria-live="polite"></p></main>
<details class="help"><summary>遊び方</summary><p>自分と同じ色の帯を目指そう。壁は2マス分。両方のネズミにゴールへの道が残る場所に置けます。</p></details>
<script>
'use strict';
const N=7,CELL=100/N-1.1,board=document.getElementById('board'),byId=id=>document.getElementById(id);let state,mode='move',busy=false,history=[],timer,epoch=0;const images=['red_mouse.png','yellow_mouse.png'],loaded=[false,false];
images.forEach((src,i)=>{const im=new Image;im.onload=()=>{loaded[i]=true;render()};im.src=src});
function initial(){return {p:[{x:Math.floor(N/2),y:N-1,dir:1},{x:Math.floor(N/2),y:0,dir:-1}],w:[],stock:[8,8],turn:0,winner:null,moves:0}}
const copy=s=>JSON.parse(JSON.stringify(s));
function inside(x,y){return x>=0&&x<N&&y>=0&&y<N}
function blocked(s,a,b){return s.w.some(w=>w.o==='h'?a.y!==b.y&&Math.min(a.y,b.y)===w.y&&a.x>=w.x&&a.x<=w.x+1:a.x!==b.x&&Math.min(a.x,b.x)===w.x&&a.y>=w.y&&a.y<=w.y+1)}
function neighbours(s,p){return [[0,-1],[0,1],[-1,0],[1,0]].map(([dx,dy])=>({x:p.x+dx,y:p.y+dy})).filter(q=>inside(q.x,q.y)&&!blocked(s,p,q))}
function legalMoves(s,i){const p=s.p[i],other=s.p[1-i],out=[];for(const q of neighbours(s,p)){if(q.x!==other.x||q.y!==other.y){out.push(q);continue}const jump={x:q.x+(q.x-p.x),y:q.y+(q.y-p.y)};if(inside(jump.x,jump.y)&&!blocked(s,q,jump))out.push(jump);else for(const d of neighbours(s,q))if((q.x===p.x?d.y===q.y:d.x===q.x))out.push(d)}return out}
function distance(s,i){const goal=i===0?0:N-1,q=[{...s.p[i],d:0}],seen=new Set([s.p[i].x+','+s.p[i].y]);for(let j=0;j<q.length;j++){const p=q[j];if(p.y===goal)return p.d;for(const n of neighbours(s,p)){const k=n.x+','+n.y;if(!seen.has(k)){seen.add(k);q.push({...n,d:p.d+1})}}}return Infinity}
function wallOK(s,w){if(!['h','v'].includes(w.o)||!Number.isInteger(w.x)||!Number.isInteger(w.y)||w.x<0||w.y<0||w.x>=N-1||w.y>=N-1)return false;if(s.w.some(a=>a.o===w.o?(a.o==='h'?a.y===w.y&&Math.abs(a.x-w.x)<2:a.x===w.x&&Math.abs(a.y-w.y)<2):a.x===w.x&&a.y===w.y))return false;const t={...s,w:[...s.w,w]};return Number.isFinite(distance(t,0))&&Number.isFinite(distance(t,1))}
function place(el,x,y,w,h){Object.assign(el.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'})}
function render(){board.replaceChildren();const active=!busy&&state.winner===null&&!(byId('opponent').value==='cpu'&&state.turn===1);const legal=legalMoves(state,state.turn);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const el=document.createElement('button');el.className='cell';el.setAttribute('aria-label',`${y+1}行${x+1}列`);place(el,x*100/N,y*100/N,CELL,CELL);if(active&&mode==='move'&&legal.some(p=>p.x===x&&p.y===y)){el.classList.add('legal');el.onclick=()=>act({x,y})}else el.disabled=true;board.append(el)}
for(const w of state.w){const el=document.createElement('div');el.className='wall';wallPosition(el,w);board.append(el)}
if(active&&mode!=='move'&&state.stock[state.turn]>0)for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++){const w={x,y,o:mode},el=document.createElement('button');el.className='slot';el.setAttribute('aria-label',`${y+1}行${x+1}列の${mode==='h'?'横':'縦'}の壁`);wallPosition(el,w,true);if(!wallOK(state,w))el.classList.add('bad');el.onclick=()=>act(w);board.append(el)}
state.p.forEach((p,i)=>{const el=document.createElement('div');el.className='pawn '+(p.dir===1?'right':'');el.dataset.player=i;el.id='pawn'+i;place(el,p.x*100/N,p.y*100/N,CELL,CELL);const sprite=document.createElement('div');if(loaded[i]){sprite.className='sprite';sprite.style.backgroundImage=`url("${images[i]}")`}else sprite.className='fallback';el.append(sprite);board.append(el)});
byId('turn').innerHTML=`<i class="light" style="background:${state.turn===0?'var(--red)':'var(--yellow)'}"></i>`+(state.winner!==null?`${state.winner===0?'赤':'黄色'}の勝ち！`: `${state.turn===0?'赤':byId('opponent').value==='cpu'?'CPU':'黄色'}の番`);byId('round').textContent='TURN '+String(state.moves+1).padStart(2,'0');for(let i=0;i<2;i++)byId('stock'+i).textContent=String(state.stock[i]).padStart(2,'0');document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.disabled=!active});byId('undo').disabled=!history.length;}
function wallPosition(el,w,hit=false){const a=100/N;if(w.o==='h')place(el,w.x*a,(w.y+1)*a-(hit?1.3:1),a*2-1.1,hit?2.6:1.1);else place(el,(w.x+1)*a-(hit?1.3:1),w.y*a,hit?2.6:1.1,a*2-1.1)}
function message(t){byId('message').textContent=t}
function act(action,cpu=false){if(busy||state.winner!==null||(!cpu&&state.turn===1&&byId('opponent').value==='cpu'))return;const i=state.turn;if(action.o){if(!state.stock[i]||!wallOK(state,action)){message('そこには壁を置けません');return}}else if(!legalMoves(state,i).some(p=>p.x===action.x&&p.y===action.y))return;history.push(copy(state));const token=epoch;if(action.o){state.w.push(action);state.stock[i]--;finish();return}busy=true;const pawn=byId('pawn'+i),p=state.p[i];if(action.x!==p.x)p.dir=action.x>p.x?1:-1;pawn.classList.toggle('right',p.dir===1);pawn.style.left=action.x*100/N+'%';pawn.style.top=action.y*100/N+'%';p.x=action.x;p.y=action.y;document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=true);message('');timer=setTimeout(()=>{if(token!==epoch)return;busy=false;finish()},420)}
function finish(){state.moves++;if(state.p[state.turn].y===(state.turn===0?0:N-1))state.winner=state.turn;else state.turn=1-state.turn;mode='move';render();message(state.winner!==null?'ゴール！ もう一度遊ぶならリセット':state.turn===1&&byId('opponent').value==='cpu'?'CPUが考えています…':'');scheduleCPU()}
function cpuChoice(s){const i=s.turn,j=1-i,moves=legalMoves(s,i);let best=moves[0],score=Infinity;for(const m of moves){const t=copy(s);t.p[i]={...t.p[i],...m};if(m.y===(i===0?0:N-1))return m;const d=distance(t,i);if(d<score){score=d;best=m}}if(!s.stock[i])return best;const own=distance(s,i),opp=distance(s,j);let bestGain=0.65;for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++)for(const o of ['h','v']){const w={x,y,o};if(!wallOK(s,w))continue;const t={...s,w:[...s.w,w]},od=distance(t,j),sd=distance(t,i),gain=(od-opp)-(sd-own)*1.3;if(gain>bestGain&&(opp<=own+2||od-opp>=3)){bestGain=gain;best=w}}return best}
function scheduleCPU(){if(state.winner===null&&state.turn===1&&byId('opponent').value==='cpu'){const token=epoch;timer=setTimeout(()=>{if(token===epoch)act(cpuChoice(state),true)},450)}}
function cancel(){epoch++;clearTimeout(timer);busy=false}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();message(mode==='move'?'':'')});byId('reset').onclick=()=>{cancel();state=initial();history=[];mode='move';render();message('')};byId('opponent').onchange=()=>byId('reset').click();byId('undo').onclick=()=>{if(!history.length)return;cancel();state=history.pop();if(byId('opponent').value==='cpu')while(state.turn===1&&history.length)state=history.pop();mode='move';render();message('前の手番に戻しました');scheduleCPU()};state=initial();render();
</script></body></html>
